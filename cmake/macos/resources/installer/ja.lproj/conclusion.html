<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>Playlister</title></head>
<body style="font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.45">
<h2 style="font-size: 17px">Playlister をインストールしました</h2>
<ol>
<li>OBS を開いている場合は、終了してからもう一度開いてください。</li>
<li>「ソース」で + を押し、Playlister を選びます。</li>
<li>「プレイリスト」の横の + を押して、ファイルまたはフォルダーを選びます。シーンがプログラムに入ると再生されます。</li>
</ol>
</body>
</html>
