<body style="font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.45">
<h2 style="font-size: 17px">O Playlister está instalado</h2>
<ol>
<li>Se o OBS estiver aberto, feche-o e abra-o de novo.</li>
<li>Em “Fontes”, clique em + e escolha Playlister.</li>
<li>Clique em + ao lado de “Lista de reprodução” e escolha seus arquivos ou uma pasta. Reproduz quando a cena estiver no Programa.</li>
</ol>
