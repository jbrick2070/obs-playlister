<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Playlister</title></head>
<body style="font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.45">
<h2 style="font-size: 17px">Playlister установлен</h2>
<ol>
<li>Если OBS открыт, закройте его и откройте снова.</li>
<li>В панели «Источники» нажмите + и выберите Playlister.</li>
<li>Нажмите + рядом с «Плейлист» и выберите файлы или папку. Воспроизведение начнётся, когда сцена будет в Передаче.</li>
</ol>
</body>
</html>
