<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="utf-8"><title>Playlister</title></head>
<body style="font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.45">
<h2 style="font-size: 17px">Playlister 已安裝</h2>
<ol>
<li>如果 OBS 已開啟，請結束後重新開啟。</li>
<li>在「來源」中按 +，選擇 Playlister。</li>
<li>按「播放清單」旁的 +，選擇你的檔案或資料夾。其場景進入展示後開始播放。</li>
</ol>
</body>
</html>
