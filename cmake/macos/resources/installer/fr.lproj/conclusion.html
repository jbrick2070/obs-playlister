<body style="font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.45">
<h2 style="font-size: 17px">Playlister est installé</h2>
<ol>
<li>Si OBS est ouvert, quittez-le puis rouvrez-le.</li>
<li>Dans « Sources », cliquez sur + et choisissez Playlister.</li>
<li>Cliquez sur + à côté de « Liste de lecture » et choisissez vos fichiers ou un dossier. La lecture démarre quand sa scène est dans le Programme.</li>
</ol>
</body>
